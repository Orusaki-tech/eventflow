volumes:
  caddy_data:
  prometheus_data:
  grafana_data:

services:
  # ---- Reverse proxy (TLS) ----
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    # Pass DOMAIN only when set on the host (empty DOMAIN= breaks {$DOMAIN::80} in Caddyfile).
    environment:
      - DOMAIN
    depends_on:
      api:
        condition: service_started

  # ---- API ----
  api:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: uvicorn eventflow.entrypoints.fastapi_app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_QUERY=${DB_QUERY:-}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOW_UNAUTHENTICATED_LOCAL=${ALLOW_UNAUTHENTICATED_LOCAL:-true}
      - ADMIN_OPERATOR_EMAILS=${ADMIN_OPERATOR_EMAILS:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - YTDLP_COOKIE_FILE=${YTDLP_COOKIE_FILE:-}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      - SUPABASE_JWT_ISSUER=${SUPABASE_JWT_ISSUER:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GOOGLE_CALENDAR_CREDENTIALS_JSON=${GOOGLE_CALENDAR_CREDENTIALS_JSON:-}
      - CALENDAR_TOKEN_KEY=${CALENDAR_TOKEN_KEY:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------- Workers ----------
  traffic_worker:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.traffic_monitor
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: &worker_env
      - DB_URL=${DB_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_QUERY=${DB_QUERY:-}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}

  scheduler:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.scheduler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker_env

  outbox_publisher:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.outbox_publisher
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker_env

  scheduler_sideeffects:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.scheduler_sideeffects
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker_env

  push_sideeffects:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.push_sideeffects
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker_env

  push_sender:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.push_sender
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_QUERY=${DB_QUERY:-}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}

  calendar_sideeffects:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.calendar_sideeffects
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_QUERY=${DB_QUERY:-}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_CALENDAR_CREDENTIALS_JSON=${GOOGLE_CALENDAR_CREDENTIALS_JSON:-}

  community_embeddings_worker:
    image: ${IMAGE_TAG:-eventflow-api:dev}
    build: .
    command: python -m eventflow.workers.community_embeddings_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *worker_env

  # ---- Monitoring ----
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    expose:
      - "3000"
