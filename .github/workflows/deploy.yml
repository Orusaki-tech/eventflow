name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGION: us-central1
  ARTIFACT_REGISTRY_REPO: eventflow
  IMAGE_NAME: api

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Resolve image tag
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE_TAG=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${ARTIFACT_REGISTRY_REPO}/${IMAGE_NAME}:${SHA}" >> $GITHUB_ENV

      - name: Deploy to GCE VM
        run: |
          # Bundle files to deploy
          tar czf /tmp/deploy.tar.gz \
            docker-compose.yml Dockerfile alembic.ini pyproject.toml \
            .env.example eventflow/ migrations/ requirements.txt \
            prometheus.yml Caddyfile grafana/

          # Copy bundle to VM (use /tmp where SSH user can write)
          gcloud compute scp \
            --zone ${{ vars.ZONE }} \
            --quiet \
            /tmp/deploy.tar.gz ${{ vars.VM_NAME }}:/tmp/deploy.tar.gz

          # Use a script file instead of passing complex bash commands in a string
          cat << 'EOF' > run_deploy.sh
          set -e

          cd /opt/eventflow

          # Extract bundle (/tmp is writable by SSH user)
          sudo tar xzf /tmp/deploy.tar.gz
          rm -f /tmp/deploy.tar.gz

          # Pull secrets from Secret Manager securely
          : > /tmp/.env.tmp
          chmod 600 /tmp/.env.tmp
          
          for secret in $(gcloud secrets list --filter="labels.service=eventflow" --format="value(name)" 2>/dev/null); do
            key=$(echo "$secret" | sed 's/^eventflow-//' | tr '[:lower:]' '[:upper:]')
            val=$(gcloud secrets versions access latest --secret="$secret" 2>/dev/null || true)
            if [ -n "$val" ]; then
              val_escaped=$(echo "$val" | sed "s/'/'\\\\''/g")
              echo "$key='$val_escaped'" >> /tmp/.env.tmp
            fi
          done
          
          sudo mv /tmp/.env.tmp /opt/eventflow/.env
          sudo chown root:root /opt/eventflow/.env
          sudo chmod 600 /opt/eventflow/.env

          # Authenticate Docker to Artifact Registry
          sudo gcloud auth configure-docker --quiet ${REGION}-docker.pkg.dev 2>/dev/null || true

          # Pull only the API image (other images are cached)
          sudo docker pull ${IMAGE_TAG}

          # Start all essential services and workers
          # Inject DOMAIN so Caddy can automatically provision HTTPS if set
          sudo IMAGE_TAG=${IMAGE_TAG} DOMAIN=${DOMAIN} docker compose up -d --remove-orphans

          # Run migrations (with timeout to avoid hanging on DB issues)
          sleep 10
          success=false
          for i in $(seq 1 5); do
            if timeout 30 sudo docker compose exec -T api alembic upgrade heads; then
              success=true
              break
            fi
            echo "alembic attempt \$i failed, retrying…"
            sleep 5
          done

          if [ "$success" = "false" ]; then
            echo "FATAL: alembic migration failed after 5 attempts" >&2
            exit 1
          fi
          EOF

          gcloud compute scp \
            --zone ${{ vars.ZONE }} \
            --quiet \
            run_deploy.sh ${{ vars.VM_NAME }}:/tmp/run_deploy.sh

          gcloud compute ssh ${{ vars.VM_NAME }} \
            --zone ${{ vars.ZONE }} \
            --quiet \
            --command "export IMAGE_TAG=${{ env.IMAGE_TAG }}; export REGION=${REGION}; export DOMAIN=${{ vars.DOMAIN }}; bash /tmp/run_deploy.sh"

      - name: Health check
        shell: bash
        run: |
          DOMAIN="${{ vars.DOMAIN }}"
          if [ -n "${DOMAIN}" ]; then
            URL="https://${DOMAIN}/api/v1/healthz"
          else
            IP=$(gcloud compute instances describe ${{ vars.VM_NAME }} \
              --zone ${{ vars.ZONE }} \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
            URL="http://${IP}/api/v1/healthz"
          fi
          echo "Computed Health Check URL: ${URL}"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 "${URL}" >/dev/null 2>&1; then
              echo "✓ API healthy at ${URL}"
              exit 0
            fi
            sleep 3
          done
          echo "WARN: health check failed after ~120s" >&2
          exit 1
